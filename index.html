<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Victoria Taxi - New Brunswick</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* Desactivar recarga al deslizar (Pull-to-Refresh) */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            overscroll-behavior-y: none !important;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            background-color: #000000;
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: #121212;
        }

        /* Convertir los azulejos del mapa a un estilo oscuro/nocturno mediante CSS */
        .leaflet-tile-container img {
            filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3);
        }

        .leaflet-control-attribution, .leaflet-control-zoom {
            display: none !important;
        }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col">

    <!-- 1. PANTALLA DE REGISTRO / AUTENTICACIÓN -->
    <div id="auth-screen" class="fixed inset-0 bg-black z-50 flex flex-col justify-center items-center p-6">
        <div class="w-24 h-24 bg-gradient-to-b from-[#cf2020] to-[#800000] rounded-2xl flex items-center justify-center shadow-lg shadow-red-900/50 mb-6">
            <span class="text-white text-5xl font-black italic">V</span>
        </div>
        <h1 class="text-2xl font-bold mb-2">Victoria Taxi</h1>
        <p class="text-gray-400 text-sm mb-6 text-center">New Brunswick, NJ</p>

        <div id="step-phone" class="w-full max-w-sm space-y-4">
            <input type="tel" id="phone-input" placeholder="Número de teléfono (+1...)" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:border-[#cf2020] outline-none">
            <button onclick="sendOtp()" class="w-full bg-[#cf2020] hover:bg-red-700 font-bold py-3 rounded-xl transition">Enviar Código SMS</button>
        </div>

        <div id="step-otp" class="w-full max-w-sm space-y-4 hidden">
            <p class="text-xs text-gray-400 text-center">Ingresa el código de 4 dígitos enviado a tu celular</p>
            <input type="text" id="otp-input" placeholder="Ej: 1234" maxlength="4" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-white text-center tracking-widest text-xl focus:border-[#cf2020] outline-none">
            <button onclick="verifyOtp()" class="w-full bg-[#cf2020] hover:bg-red-700 font-bold py-3 rounded-xl transition">Confirmar e Ingresar</button>
        </div>
    </div>

    <!-- 2. PANTALLA PRINCIPAL (MAPA Y PEDIDO) -->
    <div id="main-screen" class="flex-1 flex flex-col hidden h-full w-full">
        <!-- Mapa interactivo -->
        <div class="flex-1 relative w-full h-full">
            <div id="map"></div>
            <!-- Header flotante con logo -->
            <div class="absolute top-4 left-4 z-[1000] bg-black/90 border border-zinc-800 px-4 py-2 rounded-xl flex items-center space-x-2 shadow-lg">
                <div class="w-6 h-6 bg-[#cf2020] rounded-md flex items-center justify-center font-bold italic text-sm text-white">V</div>
                <span class="font-bold text-sm text-white">Victoria Taxi</span>
            </div>
        </div>

        <!-- Panel Inferior de Cotización -->
        <div class="bg-zinc-950 border-t border-zinc-800 p-5 rounded-t-3xl shadow-2xl z-[1000] space-y-4">
            <!-- Direcciones -->
            <div class="space-y-2">
                <div class="flex items-center space-x-3 bg-zinc-900 p-3 rounded-xl border border-zinc-800">
                    <div class="w-3 h-3 bg-green-500 rounded-full"></div>
                    <input type="text" id="origin" value="Rutgers University, New Brunswick, NJ" class="bg-transparent text-sm w-full outline-none text-white">
                </div>
                <div class="flex items-center space-x-3 bg-zinc-900 p-3 rounded-xl border border-zinc-800">
                    <div class="w-3 h-3 bg-[#cf2020] rounded-full"></div>
                    <input type="text" id="destination" value="Edison Station, NJ" class="bg-transparent text-sm w-full outline-none text-white" oninput="calculateFare()">
                </div>
            </div>

            <!-- Opciones de Servicio -->
            <div class="grid grid-cols-3 gap-2">
                <div onclick="selectService('Standard', 1.85, this)" class="service-card cursor-pointer border-2 border-[#cf2020] bg-zinc-900/80 p-3 rounded-xl text-center transition">
                    <p class="font-bold text-xs">Standard</p>
                    <p id="price-standard" class="text-sm font-extrabold text-[#cf2020] mt-1">$13.33</p>
                </div>
                <div onclick="selectService('Confort', 2.40, this)" class="service-card cursor-pointer border-2 border-zinc-800 bg-zinc-900/40 p-3 rounded-xl text-center transition">
                    <p class="font-bold text-xs">Confort</p>
                    <p id="price-confort" class="text-sm font-extrabold text-[#cf2020] mt-1">$19.30</p>
                </div>
                <div onclick="selectService('Victory', 3.20, this)" class="service-card cursor-pointer border-2 border-zinc-800 bg-zinc-900/40 p-3 rounded-xl text-center transition">
                    <p class="font-bold text-xs">Victory</p>
                    <p id="price-victory" class="text-sm font-extrabold text-[#cf2020] mt-1">$28.40</p>
                </div>
            </div>

            <!-- Botón de Pedido -->
            <button onclick="requestTaxi()" class="w-full bg-[#cf2020] hover:bg-red-700 font-bold py-3.5 rounded-xl transition shadow-lg shadow-red-900/30">
                Pedir <span id="selected-service-name">Standard</span> Taxi
            </button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, currentService = 'Standard', currentRate = 1.85;

        function sendOtp() {
            const phone = document.getElementById('phone-input').value;
            if(phone.length < 8) { alert('Ingresa un número válido'); return; }
            document.getElementById('step-phone').classList.add('hidden');
            document.getElementById('step-otp').classList.remove('hidden');
        }

        function verifyOtp() {
            const otp = document.getElementById('otp-input').value;
            if(otp.length !== 4) { alert('Ingresa el código de 4 dígitos'); return; }
            
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            
            setTimeout(initMap, 200);
        }

        function initMap() {
            if (map) return;

            // Ubicación en New Brunswick, NJ
            map = L.map('map', { 
                zoomControl: false,
                attributionControl: false
            }).setView([40.4862, -74.4518], 14);

            // Tile Server sin API Key / Sin Bloqueos de Dominio
            L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
                maxZoom: 19,
                subdomains: ['a', 'b', 'c'],
                crossOrigin: true
            }).addTo(map);

            // Marcador personalizado
            L.marker([40.4862, -74.4518]).addTo(map)
                .bindPopup('<b>Victoria Taxi</b><br>New Brunswick, NJ')
                .openPopup();

            // Renderizado óptimo para APK
            setTimeout(() => {
                map.invalidateSize();
            }, 300);

            calculateFare();
        }

        function selectService(name, rate, element) {
            currentService = name;
            currentRate = rate;
            document.getElementById('selected-service-name').innerText = name;
            
            document.querySelectorAll('.service-card').forEach(card => {
                card.classList.remove('border-[#cf2020]', 'bg-zinc-900/80');
                card.classList.add('border-zinc-800', 'bg-zinc-900/40');
            });
            element.classList.remove('border-zinc-800', 'bg-zinc-900/40');
            element.classList.add('border-[#cf2020]', 'bg-zinc-900/80');
            calculateFare();
        }

        function calculateFare() {
            document.getElementById('price-standard').innerText = '$' + (5.00 + (4.5 * 1.85)).toFixed(2);
            document.getElementById('price-confort').innerText = '$' + (8.50 + (4.5 * 2.40)).toFixed(2);
            document.getElementById('price-victory').innerText = '$' + (14.00 + (4.5 * 3.20)).toFixed(2);
        }

        function requestTaxi() {
            alert(`¡Buscando tu ${currentService} Taxi en New Brunswick! Un conductor asignado va en camino.`);
        }
    </script>
</body>
</html>
